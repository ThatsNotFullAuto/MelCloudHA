[project]
name = "melcloud-diagnostics"
version = "0.2.0"
description = "Diagnostic-first MELCloud Home integration for Home Assistant"
requires-python = ">=3.14.2"
dependencies = ["aiomelcloudhome==0.3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["analysis", ".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
