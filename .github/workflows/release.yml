name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install pytest pytest-asyncio ruff aiomelcloudhome==0.3.1 homeassistant==2026.10.4
      - run: ruff check custom_components tests tools
      - run: pytest -q
      - run: python tools/build_release.py
      - name: Publish release and HACS package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/publish_release.py --tag "$GITHUB_REF_NAME"
