name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ['2026.10.4', latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Install test dependencies
        env:
          HA_VERSION: ${{ matrix.homeassistant }}
        run: |
          python -m pip install pytest pytest-asyncio ruff aiomelcloudhome==0.3.1
          if [ "$HA_VERSION" = latest ]; then
            python -m pip install homeassistant
          else
            python -m pip install "homeassistant==$HA_VERSION"
          fi
      - name: Record resolved Home Assistant version
        run: |
          python -c "from importlib.metadata import version; print('Resolved Home Assistant: ' + version('homeassistant'))" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: ruff check custom_components tests tools
      - run: pytest -q
      - run: python tools/build_release.py
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - run: python tools/build_release.py
      - name: Publish release and HACS package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/publish_release.py --tag "$GITHUB_REF_NAME"
